# Default values for qinping-air-monitor.
replicaCount: 1

image:
  repository: zot.xinfra.ru/qinping-air-monitor
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Existing Kubernetes Secret containing QINGPING_APP_KEY and QINGPING_APP_SECRET.
# If left empty, a Secret will be created using the values from `secrets`.
existingSecret: ""

secrets:
  appKey: ""
  appSecret: ""

env:
  host: "0.0.0.0"
  port: 8000
  cacheTtlSecs: 10
  logLevel: "info"

extraEnv: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

serviceMonitor:
  enabled: true
  interval: "10s"
  scrapeTimeout: "5s"
  labels: {}
  annotations: {}

grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "/tmp/dashboards/Environment"

prometheusRule:
  enabled: false
  labels:
    role: alert-rules
  annotations: {}
  thresholds:
    co2Warning: 1000
    co2Critical: 1400
    pm25Warning: 35
    pm25Critical: 55
    pm10Warning: 50
    tempHigh: 28
    tempLow: 17
    humidityLow: 25
    humidityHigh: 70
    batteryLow: 20
    batteryCritical: 10


livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}
