# Default values for qinping-air-monitor.
replicaCount: 1

image:
  repository: zot.xinfra.ru/qinping-air-monitor
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Existing Kubernetes Secret containing QINGPING_APP_KEY and QINGPING_APP_SECRET.
# If left empty, a Secret will be created using the values from `secrets`.
existingSecret: ""

secrets:
  appKey: ""
  appSecret: ""

env:
  host: "0.0.0.0"
  port: 8000
  cacheTtlSecs: 30
  logLevel: "info"

extraEnv: []

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

serviceMonitor:
  enabled: true
  interval: "30s"
  scrapeTimeout: "10s"
  labels: {}
  annotations: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}
