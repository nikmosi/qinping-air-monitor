{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qinping-air-monitor.fullname" . }}
  labels:
    {{- include "qinping-air-monitor.labels" . | nindent 4 }}
type: Opaque
stringData:
  QINGPING_APP_KEY: {{ .Values.secrets.appKey | quote }}
  QINGPING_APP_SECRET: {{ .Values.secrets.appSecret | quote }}
{{- end }}
